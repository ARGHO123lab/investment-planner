<div class="related-section">

    <h2>Recommended Articles</h2>


    {% if related_articles %}

        {% for item in related_articles %}

        <div class="related-card">

            <a href="/blog/{{ item.slug }}" class="related-link">
                {{ item.title }}
            </a>

        </div>

        {% endfor %}

    {% else %}

        <p>No related articles available.</p>

    {% endif %}

</div>
