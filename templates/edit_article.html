<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Article | SmartPlan Finance</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f5f5f5;
            font-family: Poppins, sans-serif;
            color: #222;
        }

        .container {
            max-width: 1150px;
            margin: 35px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,.08);
        }

        h1 {
            color: #B8860B;
            margin: 0 0 25px;
            font-size: 28px;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"] {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: Poppins, sans-serif;
            font-size: 15px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #B8860B;
        }

        /*
         * EDITOR
         */

        .editor-wrapper {
            margin-top: 8px;
            border: 1px solid #d8d8d8;
            border-radius: 10px;
            background: #fff;
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            padding: 10px;
            background: #fafafa;
            border-bottom: 1px solid #ddd;
        }

        .toolbar button {
            border: 1px solid #d4d4d4;
            background: #ffffff;
            color: #222;
            border-radius: 6px;
            padding: 7px 11px;
            cursor: pointer;
            font-family: Poppins, sans-serif;
            font-size: 14px;
        }

        .toolbar button:hover {
            background: #f0f0f0;
        }

        .toolbar button.active {
            background: #e8e8e8;
        }

        .toolbar .chart-button {
            background: #fff8e1;
            border-color: #B8860B;
            color: #8a6500;
            font-weight: 600;
        }

        .toolbar .chart-button:hover {
            background: #fff1bd;
        }

        /*
         * ACTUAL EDITABLE AREA
         */

        #editor {
            min-height: 700px;
            padding: 25px;
            outline: none;
            font-family: Arial, sans-serif;
            font-size: 17px;
            line-height: 1.75;
            overflow-wrap: break-word;
        }

        #editor:focus {
            outline: none;
        }

        #editor h1,
        #editor h2,
        #editor h3,
        #editor h4 {
            line-height: 1.3;
            margin-top: 28px;
            margin-bottom: 14px;
        }

        #editor p {
            margin: 0 0 16px;
        }

        #editor ul,
        #editor ol {
            margin-bottom: 18px;
            padding-left: 30px;
        }

        #editor table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #editor th,
        #editor td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: left;
        }

        #editor th {
            font-weight: 600;
            background: #f5f5f5;
        }

        /*
         * ARTICLE IMAGES / CHARTS
         */

        #editor img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 20px auto;
            border-radius: 6px;
        }

        #editor img:hover {
            outline: 2px solid rgba(184, 134, 11, .35);
        }

        /*
         * STATUS
         */

        .editor-status {
            padding: 8px 14px;
            font-size: 13px;
            color: #666;
            background: #fafafa;
            border-top: 1px solid #eee;
        }

        .editor-status.uploading {
            color: #8a6500;
        }

        .editor-status.success {
            color: #198754;
        }

        .editor-status.error {
            color: #b02a37;
        }

        /*
         * BUTTONS
         */

        .actions {
            margin-top: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            background: #198754;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 8px;
            cursor: pointer;
            font-family: Poppins, sans-serif;
            font-size: 16px;
            font-weight: 500;
        }

        .btn:hover {
            background: #157347;
        }

        .btn:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .back {
            color: #B8860B;
            text-decoration: none;
            font-weight: 600;
        }

        .back:hover {
            text-decoration: underline;
        }

        /*
         * IMAGE UPLOAD INPUT
         */

        #chart-upload {
            display: none;
        }

        /*
         * SMALL HELP TEXT
         */

        .editor-help {
            margin-top: 8px;
            font-size: 13px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>✏️ Edit Article</h1>

    <form
        method="POST"
        id="article-form"
    >

        <input
            type="hidden"
            name="csrf_token"
            value="{{ csrf_token() }}"
        >

        <input
            type="hidden"
            name="content"
            id="content"
        >

        <label for="title">
            Article Title
        </label>

        <input
            type="text"
            id="title"
            name="title"
            value="{{ article.title }}"
            required
        >

        <label for="meta_description">
            Meta Description
        </label>

        <input
            type="text"
            id="meta_description"
            name="meta_description"
            value="{{ article.meta_description }}"
        >

        <label>
            Article Content
        </label>

        <div class="editor-wrapper">

            <div class="toolbar">

                <button
                    type="button"
                    onclick="formatText('bold')"
                    title="Bold"
                >
                    <strong>B</strong>
                </button>

                <button
                    type="button"
                    onclick="formatText('italic')"
                    title="Italic"
                >
                    <em>I</em>
                </button>

                <button
                    type="button"
                    onclick="formatText('underline')"
                    title="Underline"
                >
                    <u>U</u>
                </button>

                <button
                    type="button"
                    onclick="formatBlock('h2')"
                >
                    H2
                </button>

                <button
                    type="button"
                    onclick="formatBlock('h3')"
                >
                    H3
                </button>

                <button
                    type="button"
                    onclick="formatBlock('p')"
                >
                    Paragraph
                </button>

                <button
                    type="button"
                    onclick="formatText('insertUnorderedList')"
                >
                    • List
                </button>

                <button
                    type="button"
                    onclick="formatText('insertOrderedList')"
                >
                    1. List
                </button>

                <button
                    type="button"
                    onclick="formatText('justifyLeft')"
                >
                    Left
                </button>

                <button
                    type="button"
                    onclick="formatText('justifyCenter')"
                >
                    Center
                </button>

                <button
                    type="button"
                    onclick="insertLink()"
                >
                    🔗 Link
                </button>

                <button
                    type="button"
                    onclick="clearFormatting()"
                >
                    Clear
                </button>

                <button
                    type="button"
                    class="chart-button"
                    onclick="document.getElementById('chart-upload').click()"
                >
                    📊 Add Chart
                </button>

            </div>

            <div
                id="editor"
                contenteditable="true"
                spellcheck="true"
            >{{ article.content | safe }}</div>

            <div
                id="editor-status"
                class="editor-status"
            >
                Ready — you can type, copy/paste text, or paste chart images directly here.
            </div>

        </div>

        <div class="editor-help">
            💡 To add a chart: copy the chart image and press
            <strong>⌘ + V</strong> on Mac or
            <strong>Ctrl + V</strong> on Windows.
        </div>

        <input
            type="file"
            id="chart-upload"
            accept="image/png,image/jpeg,image/jpg,image/webp,image/gif"
        >

        <div class="actions">

            <button
                type="submit"
                class="btn"
                id="save-button"
            >
                💾 Save Changes
            </button>

            <a
                class="back"
                href="{{ url_for('view_article', slug=article.slug) }}"
            >
                ← Back to Article
            </a>

        </div>

    </form>

</div>


<script>

const editor = document.getElementById("editor");
const form = document.getElementById("article-form");
const hiddenContent = document.getElementById("content");
const statusBox = document.getElementById("editor-status");
const chartUpload = document.getElementById("chart-upload");
const saveButton = document.getElementById("save-button");

const uploadUrl = "{{ url_for('upload_article_image') }}";
const csrfToken = "{{ csrf_token() }}";


/* =========================================================
   BASIC FORMATTING
   ========================================================= */

function formatText(command) {

    editor.focus();

    document.execCommand(
        command,
        false,
        null
    );

}


function formatBlock(tag) {

    editor.focus();

    document.execCommand(
        "formatBlock",
        false,
        tag
    );

}


function clearFormatting() {

    editor.focus();

    document.execCommand(
        "removeFormat",
        false,
        null
    );

}


/* =========================================================
   INSERT LINK
   ========================================================= */

function insertLink() {

    editor.focus();

    const url = prompt(
        "Enter the URL:"
    );

    if (!url) {
        return;
    }

    document.execCommand(
        "createLink",
        false,
        url
    );

}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(message, type = "") {

    statusBox.textContent = message;

    statusBox.className =
        "editor-status " + type;

}


/* =========================================================
   IMAGE UPLOAD
   ========================================================= */

async function uploadImage(file) {

    if (!file || !file.type.startsWith("image/")) {
        return;
    }

    setStatus(
        "Uploading chart image...",
        "uploading"
    );

    try {

        const formData = new FormData();

        formData.append(
            "file",
            file,
            file.name || "chart.png"
        );

        formData.append(
            "csrf_token",
            csrfToken
        );

        const response = await fetch(
            uploadUrl,
            {
                method: "POST",
                body: formData,
                credentials: "same-origin"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error || "Image upload failed"
            );

        }

        insertImageAtCursor(
            data.url
        );

        setStatus(
            "Chart added successfully.",
            "success"
        );

    } catch (error) {

        console.error(
            "Chart upload error:",
            error
        );

        setStatus(
            "Could not upload chart: " + error.message,
            "error"
        );

    }

}


/* =========================================================
   INSERT IMAGE AT CURRENT CURSOR
   ========================================================= */

function insertImageAtCursor(imageUrl) {

    editor.focus();

    const img = document.createElement("img");

    img.src = imageUrl;

    img.alt = "SmartPlan Finance chart";

    img.loading = "lazy";

    const selection =
        window.getSelection();

    if (
        selection &&
        selection.rangeCount > 0 &&
        editor.contains(selection.anchorNode)
    ) {

        const range =
            selection.getRangeAt(0);

        range.deleteContents();

        range.insertNode(img);

        range.setStartAfter(img);

        range.collapse(true);

        selection.removeAllRanges();

        selection.addRange(range);

    } else {

        editor.appendChild(img);

    }

}


/* =========================================================
   PASTE HANDLER
   ========================================================= */

editor.addEventListener(
    "paste",
    async function(event) {

        const clipboard =
            event.clipboardData;

        if (!clipboard) {
            return;
        }

        /*
         * FIRST:
         * Check whether clipboard contains an image.
         */

        const items =
            Array.from(clipboard.items || []);

        const imageItem =
            items.find(
                item =>
                    item.kind === "file" &&
                    item.type.startsWith("image/")
            );

        if (imageItem) {

            /*
             * Stop the browser from inserting
             * a broken/base64/temporary image.
             */

            event.preventDefault();

            const file =
                imageItem.getAsFile();

            if (file) {

                await uploadImage(file);

            }

            return;

        }


        /*
         * OTHERWISE:
         * Paste text only.
         *
         * This prevents pasted website formatting,
         * HTML, fonts, colors, etc.
         */

        event.preventDefault();

        const text =
            clipboard.getData("text/plain");

        if (!text) {
            return;
        }

        editor.focus();

        document.execCommand(
            "insertText",
            false,
            text
        );

    }
);


/* =========================================================
   DRAG & DROP IMAGE
   ========================================================= */

editor.addEventListener(
    "dragover",
    function(event) {

        event.preventDefault();

    }
);


editor.addEventListener(
    "drop",
    async function(event) {

        event.preventDefault();

        const files =
            Array.from(
                event.dataTransfer.files || []
            );

        const imageFile =
            files.find(
                file =>
                    file.type.startsWith("image/")
            );

        if (imageFile) {

            await uploadImage(
                imageFile
            );

        }

    }
);


/* =========================================================
   MANUAL CHART UPLOAD BUTTON
   ========================================================= */

chartUpload.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];

        if (file) {

            await uploadImage(file);

        }

        this.value = "";

    }
);


/* =========================================================
   SAVE ARTICLE
   ========================================================= */

form.addEventListener(
    "submit",
    function(event) {

        /*
         * Copy the visual editor HTML
         * into the hidden textarea/input.
         */

        hiddenContent.value =
            editor.innerHTML.trim();

        if (!hiddenContent.value) {

            event.preventDefault();

            alert(
                "Article content cannot be empty."
            );

            return false;

        }

        saveButton.disabled = true;

        saveButton.textContent =
            "Saving...";

    }
);


/* =========================================================
   EDITOR STATUS
   ========================================================= */

editor.addEventListener(
    "input",
    function() {

        setStatus(
            "Unsaved changes."
        );

    }
);

</script>

</body>
</html>
