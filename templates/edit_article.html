<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Article | SmartPlan Finance Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .edit-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }

        .form-group input[type="text"]:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #B8860B;
            box-shadow: 0 0 5px rgba(184, 134, 11, 0.3);
        }

        /* EDITOR WITH DRAG-DROP */
        .editor-wrapper {
            border: 2px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .editor-toolbar {
            background: #f5f5f5;
            padding: 10px;
            border-bottom: 1px solid #ddd;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .editor-toolbar button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .editor-toolbar button:hover {
            background: #FFC107;
            border-color: #B8860B;
        }

        #imageUploadBtn {
            background: #FFC107;
            color: #333;
            font-weight: 600;
            border-color: #B8860B;
        }

        #imageUploadBtn:hover {
            background: #B8860B;
            color: white;
        }

        .editor-content {
            min-height: 500px;
            padding: 20px;
            overflow-y: auto;
            background: white;
            border: none;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .editor-content:focus {
            outline: none;
        }

        /* DRAG-DROP OVERLAY */
        .editor-content.drag-over {
            background-color: #FFF8E1;
            border: 2px dashed #FFC107;
        }

        /* IMAGE PREVIEW IN EDITOR */
        .editor-content img {
            max-width: 100%;
            height: auto;
            margin: 15px 0;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .editor-content img:hover {
            transform: scale(1.02);
        }

        /* HIDDEN FILE INPUT */
        #imageFileInput {
            display: none;
        }

        /* UPLOAD PROGRESS */
        .upload-progress {
            margin-top: 10px;
            display: none;
        }

        .upload-progress.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #FFC107, #B8860B);
            width: 0%;
            transition: width 0.3s;
        }

        /* ERROR & SUCCESS MESSAGES */
        .upload-status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            font-size: 14px;
        }

        .upload-status.show {
            display: block;
        }

        .upload-status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .upload-status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* ACTION BUTTONS */
        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .button-group button {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .save-btn {
            background: #FFC107;
            color: #333;
            flex: 1;
        }

        .save-btn:hover {
            background: #B8860B;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(184, 134, 11, 0.3);
        }

        .cancel-btn {
            background: #e0e0e0;
            color: #333;
            flex: 1;
        }

        .cancel-btn:hover {
            background: #bdbdbd;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .edit-container {
                margin: 20px;
                padding: 15px;
            }

            .editor-toolbar {
                flex-direction: column;
                gap: 8px;
            }

            .editor-toolbar button {
                width: 100%;
            }

            .editor-content {
                min-height: 300px;
            }

            .button-group {
                flex-direction: column;
            }
        }

        /* LOADING STATE */
        .save-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .save-btn:disabled::after {
            content: " Saving...";
        }
    </style>
</head>

<body>
<div class="edit-container">
    <h1>✏️ Edit Article</h1>
    
    <form id="editForm" method="POST">
       <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- TITLE -->
        <div class="form-group">
            <label for="title">Article Title *</label>
            <input type="text" id="title" name="title" value="{{ article.title }}" required>
        </div>

        <!-- SLUG -->
        <div class="form-group">
            <label for="slug">Article Slug (URL) *</label>
            <input type="text" id="slug" name="slug" value="{{ article.slug }}" required>
        </div>

        <!-- EXCERPT -->
        <div class="form-group">
            <label for="excerpt">Excerpt (Short Description) *</label>
            <textarea id="excerpt" name="excerpt" rows="3" required>{{ article.excerpt }}</textarea>
        </div>

        <!-- CONTENT EDITOR WITH DRAG-DROP -->
        <div class="form-group">
            <label>Article Content *</label>
            
            <!-- TOOLBAR -->
            <div class="editor-wrapper">
                <div class="editor-toolbar">
                    <button type="button" id="imageUploadBtn" title="Click or drag images here">
                        📷 Upload Image
                    </button>
                    <button type="button" id="boldBtn" title="Bold">
                        <strong>B</strong>
                    </button>
                    <button type="button" id="italicBtn" title="Italic">
                        <em>I</em>
                    </button>
                    <button type="button" id="h2Btn" title="Heading 2">
                        H2
                    </button>
                    <button type="button" id="h3Btn" title="Heading 3">
                        H3
                    </button>
                </div>

                <!-- EDITOR CONTENT AREA (DRAG-DROP ZONE) -->
                <div 
                    id="editor" 
                    class="editor-content" 
                    contenteditable="true" 
                    placeholder="Click here or paste content... Drag & drop images here too!"
                    data-initial="true"
                >
                    {{ article.content | safe }}
                </div>
            </div>

            <!-- UPLOAD PROGRESS -->
            <div class="upload-progress" id="uploadProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <!-- UPLOAD STATUS MESSAGES -->
            <div class="upload-status" id="uploadStatus"></div>
        </div>

        <!-- HIDDEN FILE INPUT -->
        <input type="file" id="imageFileInput" accept="image/*" multiple>
        
        <!-- HIDDEN CONTENT FIELD (FOR FORM SUBMISSION) -->
        <input type="hidden" id="content" name="content" value="">

        <!-- ACTION BUTTONS -->
        <div class="button-group">
            <button type="submit" class="save-btn">💾 Save Changes</button>
            <button type="button" class="cancel-btn" onclick="window.history.back()">❌ Cancel</button>
        </div>
    </form>
</div>

<!-- SCRIPT -->
<script>
const editor = document.getElementById('editor');
const editForm = document.getElementById('editForm');
const imageUploadBtn = document.getElementById('imageUploadBtn');
const imageFileInput = document.getElementById('imageFileInput');
const uploadProgress = document.getElementById('uploadProgress');
const progressFill = document.getElementById('progressFill');
const uploadStatus = document.getElementById('uploadStatus');
const contentField = document.getElementById('content');

// ==========================================
// IMAGE UPLOAD BUTTON CLICK
// ==========================================
imageUploadBtn.addEventListener('click', (e) => {
    e.preventDefault();
    imageFileInput.click();
});

// ==========================================
// FILE INPUT CHANGE (USER SELECTS FILES)
// ==========================================
imageFileInput.addEventListener('change', (e) => {
    const files = Array.from(e.target.files);
    if (files.length > 0) {
        uploadImages(files);
    }
});

// ==========================================
// DRAG AND DROP
// ==========================================
editor.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.stopPropagation();
    editor.classList.add('drag-over');
});

editor.addEventListener('dragleave', (e) => {
    e.preventDefault();
    e.stopPropagation();
    editor.classList.remove('drag-over');
});

editor.addEventListener('drop', (e) => {
    e.preventDefault();
    e.stopPropagation();
    editor.classList.remove('drag-over');
    
    const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
    if (files.length > 0) {
        uploadImages(files);
    }
});

// ==========================================
// UPLOAD IMAGES
// ==========================================
async function uploadImages(files) {
    for (const file of files) {
        // Validate file size (max 5MB)
        if (file.size > 5 * 1024 * 1024) {
            showStatus(`❌ ${file.name} is too large (max 5MB)`, 'error');
            continue;
        }

        // Validate file type
        if (!['image/jpeg', 'image/png', 'image/webp', 'image/gif'].includes(file.type)) {
            showStatus(`❌ ${file.name} is not a supported image format`, 'error');
            continue;
        }

        // Upload file
        await uploadImage(file);
    }
}

async function uploadImage(file) {
    const formData = new FormData();
    formData.append('file', file);

    uploadProgress.classList.add('active');
    progressFill.style.width = '0%';

    try {
        const xhr = new XMLHttpRequest();

        // Track upload progress
        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const percentComplete = (e.loaded / e.total) * 100;
                progressFill.style.width = percentComplete + '%';
            }
        });

        // Handle upload completion
        xhr.addEventListener('load', () => {
            uploadProgress.classList.remove('active');

            if (xhr.status === 200) {
                const response = JSON.parse(xhr.responseText);
                if (response.success) {
                    // Insert image into editor
                    const img = document.createElement('img');
                    img.src = response.url;
                    img.alt = 'SmartPlan Finance chart';
                    img.style.maxWidth = '100%';
                    img.style.height = 'auto';
                    img.style.margin = '15px 0';
                    img.style.borderRadius = '5px';
                    
                    editor.appendChild(img);
                    editor.appendChild(document.createElement('p'));
                    
                    showStatus(`✅ ${file.name} uploaded successfully`, 'success');
                } else {
                    showStatus(`❌ Upload failed: ${response.error}`, 'error');
                }
            } else {
                showStatus(`❌ Upload error: ${xhr.statusText}`, 'error');
            }
        });

        // Handle errors
        xhr.addEventListener('error', () => {
            uploadProgress.classList.remove('active');
            showStatus(`❌ Network error while uploading ${file.name}`, 'error');
        });

        // Send request
        xhr.open('POST', '/admin/upload-article-image');
        xhr.send(formData);

    } catch (error) {
        uploadProgress.classList.remove('active');
        showStatus(`❌ Error: ${error.message}`, 'error');
    }
}

// ==========================================
// SHOW STATUS MESSAGE
// ==========================================
function showStatus(message, type) {
    uploadStatus.textContent = message;
    uploadStatus.className = `upload-status show ${type}`;
    
    setTimeout(() => {
        uploadStatus.classList.remove('show');
    }, 4000);
}

// ==========================================
// TEXT FORMATTING BUTTONS
// ==========================================
document.getElementById('boldBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.execCommand('bold');
    editor.focus();
});

document.getElementById('italicBtn').addEventListener('click', (e) => {
    e.preventDefault();
    document.execCommand('italic');
    editor.focus();
});

document.getElementById('h2Btn').addEventListener('click', (e) => {
    e.preventDefault();
    document.execCommand('formatBlock', false, '<h2>');
    editor.focus();
});

document.getElementById('h3Btn').addEventListener('click', (e) => {
    e.preventDefault();
    document.execCommand('formatBlock', false, '<h3>');
    editor.focus();
});

// ==========================================
// FORM SUBMISSION
// ==========================================
editForm.addEventListener('submit', (e) => {
    e.preventDefault();
    
    // Copy editor content to hidden field
    contentField.value = editor.innerHTML.trim();
    
    if (!contentField.value) {
        alert('Please add some content to the article');
        return;
    }

    // Submit form
    editForm.submit();
});

// ==========================================
// CLEAR FILE INPUT AFTER UPLOAD
// ==========================================
function resetFileInput() {
    imageFileInput.value = '';
}

// Reset after each upload completes
document.addEventListener('upload-complete', resetFileInput);
</script>

</body>
</html>
