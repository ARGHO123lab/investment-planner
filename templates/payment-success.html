<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Payment Successful | SmartPlan Finance</title>

<style>

body{
    margin:0;
    background:#F8FAFC;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

.card{
    background:#fff;
    border-radius:18px;
    padding:40px;
    box-shadow:0 20px 50px rgba(0,0,0,.10);
    text-align:center;
}

.success{
    font-size:70px;
}

h1{
    color:#2E7D32;
    margin-bottom:10px;
}

p{
    color:#555;
    line-height:1.8;
}

.order{
    background:#F8FAFC;
    padding:18px;
    border-radius:12px;
    margin:30px 0;
    font-size:18px;
}

.download-btn{

    display:inline-block;

    margin-top:25px;

    padding:18px 35px;

    background:linear-gradient(135deg,#B8860B,#D4AF37);

    color:white;

    text-decoration:none;

    border-radius:12px;

    font-size:18px;

    font-weight:bold;

}

.support{

    margin-top:35px;

    color:#777;

    font-size:15px;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<div class="success">🎉</div>

<h1>Payment Successful!</h1>

<p>

Thank you <strong>{{ customer_name }}</strong> for purchasing
<b>Smart Money Blueprint</b>.

</p>

<div class="order">

<b>Order Number</b><br>

{{ order_number }}

</div>

<a href="/download-book" class="download-btn">

📘 Download Smart Money Blueprint

</a>

<div class="support">

Need help?<br>

support@smartplanfinance.com

</div>

</div>

</div>

</body>

</html>
