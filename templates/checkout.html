<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Checkout | SmartPlan Finance</title>
<meta name="csrf-token" content="{{ csrf_token() }}">
<style>

body{
    margin:0;
    background:#F8FAFC;
    font-family:Arial,sans-serif;
}

.container{
    max-width:700px;
    margin:60px auto;
    padding:20px;
}

.card{

    background:white;

    border-radius:18px;

    padding:40px;

    box-shadow:0 20px 50px rgba(0,0,0,.10);

}

h1{

    margin-top:0;

    color:#B8860B;

}

.row{

display:flex;

justify-content:space-between;

margin:18px 0;

font-size:18px;

}

.total{

font-size:26px;

font-weight:bold;

border-top:1px solid #ddd;

padding-top:20px;

margin-top:20px;

}

button{

width:100%;

margin-top:35px;

padding:18px;

font-size:20px;

font-weight:bold;

border:none;

border-radius:12px;

cursor:pointer;

background:linear-gradient(135deg,#B8860B,#D4AF37);

color:white;

}

.features{

margin-top:30px;

line-height:2;

color:#555;

}

.secure{

margin-top:30px;

text-align:center;

font-size:15px;

color:#777;

}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>Secure Checkout</h1>

<div class="row">
    <div style="margin-bottom:25px;">

    <label><strong>Full Name</strong></label><br>

    <input
        type="text"
        id="customer-name"
        placeholder="Enter your full name"
        required
        style="
            width:100%;
            padding:14px;
            margin-top:8px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            box-sizing:border-box;
        ">

</div>

<div style="margin-bottom:35px;">

    <label><strong>Email Address</strong></label><br>

    <input
        type="email"
        id="customer-email"
        placeholder="Enter your email"
        required
        style="
            width:100%;
            padding:14px;
            margin-top:8px;
            border:1px solid #ccc;
            border-radius:10px;
            font-size:16px;
            box-sizing:border-box;
        ">

</div>
<span>Product</span>
<span>Smart Money Blueprint (PDF)</span>
</div>

<div class="row">
<span>Author</span>
<span>Argho Sanyal</span>
</div>

<div class="row">
<span>Price</span>
<span>₹299</span>
</div>

<div class="row total">
<span>Total</span>
<span>₹299</span>
</div>

<button id="pay-btn" type="button">
    Pay Securely
</button>

<div class="features">

✔ Instant PDF Download<br>

✔ Lifetime Access<br>

✔ Secure Payment<br>

✔ Beginner Friendly

</div>

<div class="secure">

🔒 Payments secured by Razorpay

</div>

</div>

</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>

document.getElementById("pay-btn").onclick = async function () {

const name = document.getElementById("customer-name").value.trim();
const email = document.getElementById("customer-email").value.trim();
const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
if (!name) {
    alert("Please enter your full name.");
    return;
}

if (!email) {
    alert("Please enter your email address.");
    return;
}
    await fetch("/save-customer-details", {

    method: "POST",

    headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrfToken
    },

    body: JSON.stringify({
        name: name,
        email: email
    })

});

    

    const response = await fetch("/create-order", {
        method: "POST",
        headers: {
            "X-CSRFToken": csrfToken
        }
    });

    const order = await response.json();

var options = {

    "key": "rzp_test_THRU8GuWd6guwr",

    "amount": order.amount,

    "currency": order.currency,

    "name": "SmartPlan Finance",

    "description": "Smart Money Blueprint PDF",

    "order_id": order.id,

    "handler": async function (response){

    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

const verifyResponse = await fetch("/verify-payment", {

    method: "POST",

    headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrfToken
    },

    body: JSON.stringify(response)

});


    const result = await verifyResponse.json();


    if(result.success){

    window.location.href = result.redirect;

}

    else{

        alert("Payment Verification Failed");

    }

},

    "theme": {
        "color": "#B8860B"
    }

};


var rzp = new Razorpay(options);

rzp.open();

};

</script>
</body>
</html>
